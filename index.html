---
layout: none
---
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Replikasi Profil Instagram</title>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core@8/dist/ionic/ionic.esm.js"></script>
  <script nomodule src="https://cdn.jsdelivr.net/npm/@ionic/core@8/dist/ionic/ionic.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core@8/css/ionic.bundle.css" />
  
  <style>
    :root {
      --ion-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .profile-header { padding: 16px; }
    .avatar-container { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .avatar-img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 1px solid #dbdbdb; }
    .stat-box { text-align: center; flex: 1; }
    .stat-value { font-weight: bold; font-size: 1.1rem; display: block; }
    .stat-label { font-size: 0.85rem; color: #666; }
    .bio-section { margin-bottom: 16px; font-size: 0.95rem; }
    .bio-name { font-weight: bold; }
    .action-buttons { display: flex; gap: 8px; margin-bottom: 16px; }
    .action-buttons ion-button { flex: 1; --border-radius: 8px; height: 35px; font-size: 0.85rem; text-transform: none; }
    .grid-image { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; }
    ion-segment { border-top: 1px solid #efefef; }
    ion-segment-button ion-icon { font-size: 24px; }
  </style>
</head>
<body>
  <ion-app>
    <ion-header class="ion-no-border">
      <ion-toolbar>
        <ion-buttons slot="start">
          <ion-button><ion-icon name="chevron-back-outline"></ion-icon></ion-button>
        </ion-buttons>
        <ion-title align="center" style="font-weight: bold; font-size: 1rem;">vildaesamlysri</ion-title>
        <ion-buttons slot="end">
          <ion-button><ion-icon name="ellipsis-horizontal-outline"></ion-icon></ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <div class="profile-header">
        <div class="avatar-container">
          <img src="https://placehold.co/orange/white/150?text=V" class="avatar-img" alt="Profile">
          <div class="stat-box">
            <span class="stat-value">32</span>
            <span class="stat-label">posts</span>
          </div>
          <div class="stat-box">
            <span class="stat-value">766</span>
            <span class="stat-label">followers</span>
          </div>
          <div class="stat-box">
            <span class="stat-value">246</span>
            <span class="stat-label">following</span>
          </div>
        </div>

        <div class="bio-section">
          <div class="bio-name">Vilda</div>
          <div>collecting moments</div>
          <div style="display: flex; align-items: center; color: #385898;">
            <ion-icon name="at-outline" style="margin-right: 4px;"></ion-icon>
            vildaesamlysri
          </div>
        </div>

        <div class="action-buttons">
          <ion-button fill="outline" color="dark">Following <ion-icon slot="end" name="chevron-down"></ion-icon></ion-button>
          <ion-button fill="outline" color="dark">Message</ion-button>
          <ion-button fill="outline" color="dark" style="flex: 0.1;"><ion-icon name="person-add-outline"></ion-icon></ion-button>
        </div>
      </div>

      <ion-segment value="grid">
        <ion-segment-button value="grid">
          <ion-icon name="grid-outline"></ion-icon>
        </ion-segment-button>
        <ion-segment-button value="reels">
          <ion-icon name="play-circle-outline"></ion-icon>
        </ion-segment-button>
        <ion-segment-button value="mentions">
          <ion-icon name="person-circle-outline"></ion-icon>
        </ion-segment-button>
      </ion-segment>

      <ion-grid class="ion-no-padding">
        <ion-row>
          <ion-col size="4" style="padding: 1px;"><img src="https://placehold.co/400x600?text=Hello" class="grid-image"></ion-col>
          <ion-col size="4" style="padding: 1px;"><img src="https://placehold.co/400x600?text=World" class="grid-image"></ion-col>
          <ion-col size="4" style="padding: 1px;"><img src="https://placehold.co/400x600?text=Apa" class="grid-image"></ion-col>
          <ion-col size="4" style="padding: 1px;"><img src="https://placehold.co/400x600?text=Kabar" class="grid-image"></ion-col>
          <ion-col size="4" style="padding: 1px;"><img src="https://placehold.co/400x600?text=Semoga" class="grid-image"></ion-col>
          <ion-col size="4" style="padding: 1px;"><img src="https://placehold.co/400x600?text=Baik" class="grid-image"></ion-col>
        </ion-row>
      </ion-grid>
    </ion-content>

    <ion-footer class="ion-no-border">
      <ion-toolbar>
        <ion-tabs>
          <ion-tab-bar slot="bottom">
            <ion-tab-button tab="home"><ion-icon name="home-outline"></ion-icon></ion-tab-button>
            <ion-tab-button tab="search"><ion-icon name="search-outline"></ion-icon></ion-tab-button>
            <ion-tab-button tab="add"><ion-icon name="add-circle-outline"></ion-icon></ion-tab-button>
            <ion-tab-button tab="reels"><ion-icon name="play-outline"></ion-icon></ion-tab-button>
            <ion-tab-button tab="profile"><ion-icon name="person-circle"></ion-icon></ion-tab-button>
          </ion-tab-bar>
        </ion-tabs>
      </ion-toolbar>
    </ion-footer>
  </ion-app>

  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>
</html>
